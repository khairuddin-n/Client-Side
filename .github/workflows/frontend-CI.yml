name: Frontend checks and staging deployment

on:
  push:
    branches: [staging, main, 'refactor/**']
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            jrtr1/wandoor-frontend-app:frontend-${{ github.sha }}
            jrtr1/wandoor-frontend-app:frontend-latest

      # === Find & Replace image tag di repo infra branch (staging) ===
      - name: Checkout infra repository (staging)
        uses: actions/checkout@v4
        with:
          repository: kelompok-3-odp343/infra
          token: ${{ secrets.ACCESS_TOKEN }}
          path: infra
          ref: staging

      - name: Update image tag in frontend deployment
        run: |
          cd infra/k3s/frontend-wandoor
          sed -i "s|jrtr1/wandoor-frontend-app:.*|jrtr1/wandoor-frontend-app:frontend-${{ github.sha }}|g" frontend-deployment.yaml

      - name: Commit and push updated image tag
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update frontend image tag to frontend-${{ github.sha }}"
            git push origin staging
          fi
